name: Build U-Boot for 360T7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Generate minimal config
        run: |
          # 只编 U-Boot 和 TF-A (BL2/BL31)，不编整套固件，同时覆盖普通布局与 UBI 布局两个变体
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y
          CONFIG_PACKAGE_trusted-firmware-a-mt7981-spim-nand-ddr3-1866=y
          CONFIG_PACKAGE_trusted-firmware-a-mt7981-spim-nand-ubi-ddr3-1866=y
          CONFIG_PACKAGE_u-boot-mt7981_qihoo_360t7=y
          CONFIG_PACKAGE_u-boot-mt7981_qihoo_360t7-ubi=y
          EOF
          make defconfig
          # 配置未生效就提前失败，避免空跑几十分钟
          for opt in \
            CONFIG_PACKAGE_u-boot-mt7981_qihoo_360t7 \
            CONFIG_PACKAGE_u-boot-mt7981_qihoo_360t7-ubi \
            CONFIG_PACKAGE_trusted-firmware-a-mt7981-spim-nand-ddr3-1866 \
            CONFIG_PACKAGE_trusted-firmware-a-mt7981-spim-nand-ubi-ddr3-1866; do
            grep -q "^${opt}=y" .config || { echo "::error::${opt} 未被启用"; exit 1; }
          done

      - name: Download sources
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build toolchain
        run: |
          make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

      - name: Build TF-A and U-Boot
        run: |
          make -j$(nproc) package/boot/arm-trusted-firmware-mediatek/compile package/boot/uboot-mediatek/compile \
            || make -j1 V=s package/boot/arm-trusted-firmware-mediatek/compile package/boot/uboot-mediatek/compile

      - name: Collect bootloader files
        id: collect
        run: |
          IMG_DIR=$(find staging_dir -maxdepth 2 -type d -name image -path '*target-*' | head -n 1)
          echo "staging image dir: $IMG_DIR"
          ls -la "$IMG_DIR"

          mkdir -p out
          P=immortalwrt-mediatek-filogic

          # 普通布局 (fip / ubi / Factory 分区)，与 qihoo_360t7 固件配套
          cp "$IMG_DIR/mt7981_qihoo_360t7-u-boot.fip"            "out/$P-qihoo_360t7-bl31-uboot.fip"
          cp "$IMG_DIR/mt7981-spim-nand-ddr3-1866-bl2.img"       "out/$P-qihoo_360t7-preloader.bin"

          # 全 UBI 布局，与 qihoo_360t7-ubi 固件配套
          cp "$IMG_DIR/mt7981_qihoo_360t7-ubi-u-boot.fip"        "out/$P-qihoo_360t7-ubi-bl31-uboot.fip"
          cp "$IMG_DIR/mt7981-spim-nand-ubi-ddr3-1866-bl2.img"   "out/$P-qihoo_360t7-ubi-preloader.bin"

          cd out
          sha256sum * > sha256sums
          ls -lah
          cat sha256sums

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-uboot-${{ steps.date.outputs.date }}
          path: out/
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "360T7 U-Boot ${{ steps.date.outputs.build_date }} #${{ github.run_number }}"
          tag_name: "uboot-${{ steps.date.outputs.date }}"
          prerelease: true
          body: |
            ## 360T7 U-Boot (BL2 + BL31 + U-Boot)

            - 编译时间：${{ steps.date.outputs.date }}
            - 源码：ImmortalWrt 25.12 + MTK U-Boot 2025.10

            ### 文件说明（两套布局，务必选对）

            | 布局 | preloader (BL2) | bl31-uboot.fip | 配套固件 |
            |---|---|---|---|
            | 普通布局 | `*-qihoo_360t7-preloader.bin` | `*-qihoo_360t7-bl31-uboot.fip` | `qihoo_360t7` sysupgrade.itb |
            | 全 UBI 布局 | `*-qihoo_360t7-ubi-preloader.bin` | `*-qihoo_360t7-ubi-bl31-uboot.fip` | `qihoo_360t7-ubi` sysupgrade.itb |

            ### 风险提示
            - 刷 BL2 / FIP 属于改写引导，刷错布局或刷到一半断电都可能变砖，请先备份原厂分区并准备好编程器。
            - 刷之前用 `sha256sums` 校验文件。
            - 普通布局与 UBI 布局的分区表不同，U-Boot 与固件必须同一种布局，不能混用。
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
