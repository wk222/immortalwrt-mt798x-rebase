name: Build ImmortalWrt 25.12 for 360T7

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup
          sudo docker image prune -a -f || true
          sudo apt-get clean
          df -h

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
            unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          cp defconfig/360t7.config .config
          make defconfig

      - name: Download package sources
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "build_status=success" >> $GITHUB_ENV

      - name: Prepare firmware files
        if: env.build_status == 'success'
        run: |
          mkdir -p release_firmware
          cp bin/targets/mediatek/filogic/*qihoo_360t7*sysupgrade.itb release_firmware/ 2>/dev/null || true
          cp bin/targets/mediatek/filogic/*qihoo_360t7*recovery.itb release_firmware/ 2>/dev/null || true
          cp bin/targets/mediatek/filogic/sha256sums release_firmware/ 2>/dev/null || true
          cp bin/targets/mediatek/filogic/config.buildinfo release_firmware/ 2>/dev/null || true
          cp bin/targets/mediatek/filogic/*qihoo_360t7*.manifest release_firmware/ 2>/dev/null || true
          cd release_firmware
          echo "Firmware files to release:"
          ls -lah

      - name: Upload firmware to Artifacts
        if: env.build_status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12-360T7-firmware-${{ steps.date.outputs.date }}
          path: release_firmware/
          retention-days: 14

      - name: Create Release and Upload Assets
        if: env.build_status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: "360T7 固件 ${{ steps.date.outputs.build_date }} #${{ github.run_number }}"
          tag_name: "release-${{ steps.date.outputs.date }}"
          body: |
            ## 360T7 自动编译固件

            - 编译时间：${{ steps.date.outputs.date }}
            - 适配机型：Qihoo 360T7（MT7981B / 128MB NAND）
            - 源码分支：ImmortalWrt 25.12 (Linux 6.12 内核)
            - 驱动特性：MTK 原厂 Wi-Fi 闭源驱动 + MTK HNAT 硬件加速
            - 核心功能：
              - 科学上网：OpenClash、PassWall (含 Sing-Box, Xray, Haproxy 等)
              - 虚拟组网：Tailscale (含 LuCI 管理界面)
              - 硬件加速：TurboACC MTK (HNAT 硬件加速)
              - 网络管理：UPnP、网络唤醒 (WOL)、定时重启
              - 系统与界面：Argon 主题与美化设置、Web 终端 (ttyd)、磁盘管理 (Diskman)、软件包管理器
            - 刷机说明：
              - 已刷大分区 U-Boot 的设备，可在当前系统的 Web 升级页面或进 U-Boot Web 后台上传 `*sysupgrade.itb` 直接刷写升级。
          files: release_firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
