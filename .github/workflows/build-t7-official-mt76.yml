name: Build 360T7 official OpenWrt 25.12.5 + mt76 (hanwckf U-Boot)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  OPENWRT_TAG: v25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/.ghcup
          sudo docker image prune -a -f || true
          sudo apt-get clean
          df -h

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget libelf-dev ccache xxd
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Clone official OpenWrt ${{ env.OPENWRT_TAG }}
        run: |
          git clone --depth 1 --branch "$OPENWRT_TAG" https://github.com/openwrt/openwrt.git openwrt
          git clone --depth 1 --branch openwrt-25.12 https://github.com/immortalwrt/packages.git iw-packages
          cd openwrt && git log -1 --oneline

      - name: Feeds (official + ImmortalWrt luci for HomeProxy/ZeroTier UI)
        working-directory: openwrt
        run: |
          cp feeds.conf.default feeds.conf
          echo 'src-git immortalluci https://github.com/immortalwrt/luci.git;openwrt-25.12' >> feeds.conf
          ./scripts/feeds update -a
          # HomeProxy 针对 sing-box 1.12.x 编写, 官方 packages 已是 1.13.x, 这里换成已验证的 1.12.25 (full 变体)
          rm -rf feeds/packages/net/sing-box
          cp -r ../iw-packages/net/sing-box feeds/packages/net/sing-box
          # immortalluci 排在 feeds.conf 最后, 同名包以官方 feed 为准, 只补官方没有的 (homeproxy / zerotier UI)
          ./scripts/feeds install -a
          ls -d package/feeds/immortalluci/luci-app-homeproxy package/feeds/immortalluci/luci-app-zerotier

      - name: Apply 360T7 hanwckf-U-Boot overlay
        run: |
          python3 scripts/apply_overlay.py openwrt overlay
          cd openwrt
          grep -n "qihoo_360t7-mtkuboot" target/linux/mediatek/image/filogic.mk
          grep -n "qihoo,360t7-mtkuboot" target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          ls files/etc

      - name: Load configuration
        working-directory: openwrt
        run: |
          cp ../overlay/config.seed .config
          make defconfig
          for k in CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7-mtkuboot CONFIG_PACKAGE_luci-app-homeproxy CONFIG_PACKAGE_sing-box CONFIG_PACKAGE_zerotier CONFIG_PACKAGE_luci-app-zerotier CONFIG_PACKAGE_kmod-mt7915e; do
            grep -q "^$k=y" .config || { echo "MISSING: $k"; exit 1; }
          done
          grep -E '^CONFIG_PACKAGE_(sing-box|luci-app-homeproxy|zerotier|luci-app-zerotier|kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware)=' .config
          grep -E 'MTD_NAND_MTK_BMT' target/linux/mediatek/filogic/config-6.12

      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "build_status=success" >> $GITHUB_ENV

      - name: Prepare firmware files
        if: env.build_status == 'success'
        run: |
          mkdir -p release_firmware
          d=openwrt/bin/targets/mediatek/filogic
          ls -lah $d | head -50
          cp $d/*qihoo_360t7-mtkuboot*factory.bin release_firmware/
          cp $d/*qihoo_360t7-mtkuboot*sysupgrade.bin release_firmware/
          cp $d/sha256sums release_firmware/ 2>/dev/null || true
          cp $d/*qihoo_360t7-mtkuboot*.manifest release_firmware/ 2>/dev/null || true
          cp openwrt/.config release_firmware/config.buildinfo
          cd release_firmware
          f=$(ls *qihoo_360t7-mtkuboot*factory.bin)
          echo "factory: $f $(stat -c%s "$f")"
          # hanwckf U-Boot 只认 UBI 镜像, 魔数必须是 UBI#
          [ "$(head -c4 "$f")" = "UBI#" ] || { echo "factory.bin 不是 UBI 镜像"; exit 1; }
          [ "$(stat -c%s "$f")" -gt 8000000 ] || { echo "factory.bin 过小"; exit 1; }
          ls -lah

      - name: Upload firmware to Artifacts
        if: env.build_status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-official-mt76-${{ steps.date.outputs.date }}
          path: release_firmware/
          retention-days: 14

      - name: Create Release and Upload Assets
        if: env.build_status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: "360T7 官方 OpenWrt 25.12.5 + mt76 (hanwckf U-Boot) ${{ steps.date.outputs.build_date }} #${{ github.run_number }}"
          tag_name: "official-mt76-${{ steps.date.outputs.date }}"
          body: |
            ## 360T7 官方 OpenWrt 25.12.5 + 开源 mt76 WiFi

            - 源码: openwrt/openwrt `v25.12.5` (Linux 6.12), WiFi 为官方 mt76(mt7915e), 无闭源驱动
            - 适配 hanwckf bl-mt798x U-Boot (108M UBI 布局, NMBM)。在 U-Boot 网页恢复页上传 `*-squashfs-factory.bin`
            - 系统内升级使用 `*-squashfs-sysupgrade.bin`。不要刷官方的 `.itb`
            - 含: HomeProxy (sing-box 1.12.25, 已内置离线规则集)、ZeroTier、tcpdump、mtr、iftop、ttyd、zram-swap。不含 PassWall / OpenClash / Tailscale
            - 默认 LAN 192.168.10.1 (避免与上级 192.168.1.x 冲突), root 初始无密码, 首次进 LuCI 请设置密码
            - 注意: 此镜像没有硬件 WiFi/HNAT 加速的闭源栈, 内存占用更低, 但 WiFi 吞吐/稳定性请自行验证
          files: release_firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
